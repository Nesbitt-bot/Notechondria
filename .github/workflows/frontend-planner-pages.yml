name: frontend-planner-pages

on:
  push:
    branches: [ main, codex ]
    paths:
      - 'frontend/planner_app/**'
      - 'frontend/shared/**'
      - '.github/workflows/frontend-planner-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Flutter pub get (shared)
        working-directory: frontend/shared
        run: flutter pub get

      - name: Flutter pub get (planner)
        working-directory: frontend/planner_app
        run: flutter pub get

      - name: Flutter build web (planner)
        working-directory: frontend/planner_app
        run: flutter build web --release --base-href /planner/ || echo "Build failed, checking for errors"

      - name: Stage planner site
        run: |
          mkdir -p /tmp/pages/planner
          rsync -a frontend/planner_app/build/web/ /tmp/pages/planner/ || echo "Stage failed"

      - name: Deploy planner to gh-pages/planner
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/pages
          keep_files: true
          allow_empty_commit: false
